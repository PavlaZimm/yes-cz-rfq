<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Objednávka dopravy - Yes.cz">
    <title>Objednávka dopravy - Yes.cz</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo-section">
                <img src="assets/images/yes_cz_logo07 FINAL01 solo.png" alt="yes.cz - your energy stock" class="logo-img">
            </div>
            <div class="lang-switcher" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="cs" aria-label="Čeština">CZ</button>
                <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Error Alert -->
            <div id="errorAlert" class="alert alert-error" role="alert" aria-live="assertive" style="display: none;">
                <span class="alert-icon">&#10060;</span>
                <div class="alert-content">
                    <strong>Chyba</strong>
                    <p id="errorMessage"></p>
                </div>
            </div>

            <!-- Stav: Neplatný odkaz -->
            <div id="invalidLinkCard" class="form-card" style="display: none; text-align: center;">
                <h1 class="form-title">Neplatný odkaz</h1>
                <p class="form-subtitle">Neplatný odkaz. Zkontrolujte email s pozvánkou.</p>
            </div>

            <!-- Stav: Formulář dopravy -->
            <div id="transportCard" class="form-card" style="display: none;">
                <!-- Detail zásilky (read-only) -->
                <fieldset class="form-section">
                    <legend class="form-section-title">Detail zásilky</legend>

                    <div class="detail-grid">
                        <div class="detail-item" id="detail-dodavatel">
                            <span class="detail-label">Dodavatel</span>
                            <span class="detail-value detail-value-highlight" id="val-dodavatel"></span>
                        </div>
                    </div>
                </fieldset>

                <!-- Formulář dopravy -->
                <form id="transportForm" class="form" novalidate>
                    <fieldset class="form-section">
                        <legend class="form-section-title">Objednávka dopravy</legend>

                        <!-- Adresa skladu / místo vyzvednutí -->
                        <div class="form-group">
                            <label for="adresa_skladu" class="form-label">
                                Adresa skladu / místo vyzvednutí <span class="required">*</span>
                            </label>
                            <select
                                id="adresa_skladu"
                                name="adresa_skladu"
                                class="form-input"
                                required
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="adresa-vyzvednuti-error"
                            >
                                <option value="Kozomín 501, 277 45 Kozomín">Kozomín 501, 277 45 Kozomín</option>
                                <option value="Brněnská 2297, 686 03 Staré Město">Brněnská 2297, 686 03 Staré Město</option>
                            </select>
                            <span id="adresa-vyzvednuti-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Adresa dodání -->
                        <div class="form-group">
                            <label for="adresa_dodani" class="form-label">
                                Adresa dodání <span class="required">*</span>
                            </label>
                            <input
                                type="text"
                                id="adresa_dodani"
                                name="adresa_dodani"
                                class="form-input"
                                required
                                maxlength="300"
                                placeholder="Adresa místa dodání"
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="adresa-dodani-error"
                            >
                            <span id="adresa-dodani-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Způsob balení -->
                        <div class="form-group">
                            <label for="zpusob_baleni" class="form-label">
                                Způsob balení <span class="required">*</span>
                            </label>
                            <input
                                type="text"
                                id="zpusob_baleni"
                                name="zpusob_baleni"
                                class="form-input"
                                required
                                maxlength="200"
                                placeholder="Např. na paletě, v kartonu..."
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="zpusob-baleni-error"
                            >
                            <span id="zpusob-baleni-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Počet palet -->
                        <div class="form-group">
                            <label for="pocet_palet" class="form-label">
                                Počet palet <span class="required">*</span>
                            </label>
                            <input
                                type="number"
                                id="pocet_palet"
                                name="pocet_palet"
                                class="form-input"
                                required
                                min="1"
                                step="1"
                                placeholder="0"
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="pocet-palet-error"
                            >
                            <span id="pocet-palet-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Rozměry zásilky -->
                        <div class="form-group">
                            <label for="rozmery_palety" class="form-label">
                                Rozměry zásilky (cm) <span class="required">*</span>
                            </label>
                            <input
                                type="text"
                                id="rozmery_palety"
                                name="rozmery_palety"
                                class="form-input"
                                required
                                maxlength="100"
                                placeholder="délka × šířka × výška (cm), např. 120 × 80 × 150"
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="rozmery-palety-hint rozmery-palety-error"
                            >
                            <span id="rozmery-palety-hint" class="form-hint">délka × šířka × výška, např. 120 × 80 × 150</span>
                            <span id="rozmery-palety-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Váha celkem -->
                        <div class="form-group">
                            <label for="vaha_kg" class="form-label">
                                Váha celkem (kg) <span class="required">*</span>
                            </label>
                            <input
                                type="number"
                                id="vaha_kg"
                                name="vaha_kg"
                                class="form-input"
                                required
                                min="0.1"
                                step="0.1"
                                placeholder="0"
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="vaha-kg-error"
                            >
                            <span id="vaha-kg-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Požadovaný termín přepravy -->
                        <div class="form-group">
                            <label for="termin_prepravy" class="form-label">
                                Požadovaný termín přepravy <span class="required">*</span>
                            </label>
                            <input
                                type="date"
                                id="termin_prepravy"
                                name="termin_prepravy"
                                class="form-input"
                                required
                                aria-required="true"
                                aria-invalid="false"
                                aria-describedby="termin-prepravy-error"
                            >
                            <span id="termin-prepravy-error" class="form-error" role="alert"></span>
                        </div>

                        <!-- Poznámka -->
                        <div class="form-group">
                            <label for="poznamka" class="form-label">
                                Poznámka <span class="optional">(volitelně)</span>
                            </label>
                            <textarea
                                id="poznamka"
                                name="poznamka"
                                class="form-input form-textarea"
                                maxlength="1000"
                                rows="4"
                                aria-describedby="poznamka-hint poznamka-counter"
                            ></textarea>
                            <div class="form-hint-row">
                                <span id="poznamka-hint" class="form-hint">Maximálně 1000 znaků</span>
                                <span id="poznamka-counter" class="form-counter">0/1000</span>
                            </div>
                        </div>
                    </fieldset>

                    <!-- Button -->
                    <button type="submit" class="btn btn-primary" id="submitBtn" aria-label="Odeslat objednávku dopravy">
                        <span class="btn-text">Odeslat objednávku dopravy</span>
                        <span class="btn-loader" aria-hidden="true" style="display: none;">
                            <span class="spinner"></span>
                            Odesílám...
                        </span>
                    </button>
                </form>
            </div>

            <!-- Stav: Úspěch po odeslání -->
            <div id="successCard" class="form-card" style="display: none; text-align: center;">
                <div class="success-icon">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h1 class="success-title">Děkujeme!</h1>
                <p class="success-perex">Objednávka dopravy byla úspěšně odeslána.</p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="doprava.js"></script>
</body>
</html>
